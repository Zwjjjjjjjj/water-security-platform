<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <!--
    核电厂取排水系统（示意）
    坐标系：底图设计坐标 1000x500（x 向东，y 向南）
    - 取水口：设计坐标 x=350, y=104
    - 排水口：设计坐标 x=590, y=104
    取水为明渠自岸线向东南伸入海域；排水为暗渠，先沿岸线外推再向东南入海。
  -->

  <!-- 一、取水明渠：自取水口向东南伸入海域，窄水道 -->
  <g>
    <path d="M350,108 C366,150 392,196 428,240 C462,282 500,316 546,344"
          fill="none" stroke="#4dcddb" stroke-opacity=".16" stroke-width="26" stroke-linecap="round"/>
    <path d="M337,106 C353,149 379,195 415,239 C449,281 487,315 533,343"
          fill="none" stroke="#8fc4d4" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="10 7"/>
    <path d="M363,110 C379,152 405,197 441,241 C475,283 513,317 559,345"
          fill="none" stroke="#8fc4d4" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="10 7"/>
    <path d="M350,108 C366,150 392,196 428,240 C462,282 500,316 546,344"
          fill="none" stroke="#6ce5e8" stroke-opacity=".6" stroke-width="1.2" stroke-dasharray="16 8 3 8"/>
    <path d="M336,106 L364,110 L360,120 L340,116 Z" fill="#8fe0b8" fill-opacity=".55" stroke="#8fe0b8" stroke-width="1.2"/>
    <circle cx="350" cy="113" r="3.4" fill="#8fe0b8"/>
    <g opacity=".5">
      <path d="M538,336 L556,344 M542,330 L560,338 M548,342 L566,350"
            stroke="#6ce5e8" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 二、排水暗渠：自排水口先沿岸外推，再向东南入海 -->
  <g>
    <path d="M590,110 C616,140 648,172 690,202 C732,232 778,258 826,282"
          fill="none" stroke="#4d6170" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <path d="M590,110 C616,140 648,172 690,202 C732,232 778,258 826,282"
          fill="none" stroke="#c2a06a" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="9 6"/>
    <g opacity=".42" fill="#c2a06a">
      <ellipse cx="832" cy="286" rx="20" ry="8" transform="rotate(28 832 286)"/>
      <ellipse cx="848" cy="294" rx="13" ry="6" transform="rotate(28 848 294)"/>
    </g>
    <path d="M578,106 L604,114 L600,124 L580,116 Z" fill="#f0c08a" fill-opacity=".5" stroke="#f0c08a" stroke-width="1.2"/>
    <circle cx="590" cy="115" r="3.4" fill="#f0c08a"/>
  </g>

  <!-- 三、取排水口与厂区连接 -->
  <g opacity=".8">
    <path d="M350,104 L350,96 M590,104 L590,96" stroke="#7fb6c9" stroke-width="1.2" stroke-dasharray="4 4"/>
  </g>
</svg>
